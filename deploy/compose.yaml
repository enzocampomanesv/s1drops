# Always-on deployment of the s1drops API, the back end of Space4All's
# Demolition detection page (https://space4all.web.app/tools/demolitions/),
# published by Tailscale Funnel on the host (free) or by an opt-in Cloudflare
# named tunnel. Both dial OUT, so the server needs no inbound ports beyond SSH.
# See deploy/README.md.
#
#   cd deploy && cp .env.example .env   # then fill it in
#   docker compose up -d --build
#
# The Solara app (the old interface, its own sign-in) was retired on 2026-11-25:
# its address forwards to the Space4All page (the API's catch-all route).

name: s1drops

services:
  api:
    build:
      context: ..
      dockerfile: s1drops/Dockerfile
    image: s1drops:latest
    restart: unless-stopped
    # No request log: it would hold visitors' IP addresses, which Space4All's
    # privacy notice says the tool doesn't keep. Errors are still logged.
    command: ["uvicorn", "s1drops.api.main:app", "--host", "0.0.0.0", "--port", "8766", "--proxy-headers", "--no-access-log"]
    environment:
      S1DROPS_CACHE_DIR: /data/cache
      # Accounts, verdicts, reference data, feedback. Backed up by backup-db.sh.
      S1DROPS_DB_PATH: /data/db/app.db
      # These accounts are admins from their first sign-in (Space4All, verified email).
      S1DROPS_ADMIN_EMAILS: ${S1DROPS_ADMIN_EMAILS:-}
      # Empty disables LCZ; set to /data/lcz/lcz_cog.tif once the file is on the host.
      S1DROPS_LCZ_PATH: ${S1DROPS_LCZ_PATH:-}
      S1DROPS_NATIVE10_MAX_KM2: ${S1DROPS_NATIVE10_MAX_KM2:-10}
      S1DROPS_MAX_CUBE_BYTES: ${S1DROPS_MAX_CUBE_BYTES:-2000000000}
      # Space4All's Firebase project: whose sign-ins the API accepts.
      S1DROPS_FIREBASE_PROJECT: ${S1DROPS_FIREBASE_PROJECT:-livability-mapping-prod}
      # Pages allowed to call it (CORS), comma-separated.
      S1DROPS_API_ORIGINS: ${S1DROPS_API_ORIGINS:-https://space4all.web.app}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      # Baked cubes + photo tiles. Must outlive the container.
      - ${S1DROPS_DATA_DIR:-/srv/s1drops}/cache:/data/cache
      # The database. Must outlive the container.
      - ${S1DROPS_DATA_DIR:-/srv/s1drops}/db:/data/db
      # LCZ raster, read-only. Harmless if the directory is empty.
      - ${S1DROPS_DATA_DIR:-/srv/s1drops}/lcz:/data/lcz:ro
    # Localhost only; public traffic comes through Funnel (or cloudflared).
    ports:
      - "127.0.0.1:8766:8766"
    # Page requests, bakes and monthly updates: working out an area's drop map peaks
    # at about 4 GB for the largest (Nairobi, 728 passes at 100 m), and a bake holds
    # the whole cube in memory (up to S1DROPS_MAX_CUBE_BYTES, ~6 GB with its reads).
    # The VM has 24 GB.
    mem_limit: ${S1DROPS_API_MEM_LIMIT:-12g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Opt-in: only for the Cloudflare named-tunnel route (needs a domain on
  # Cloudflare). Enable with COMPOSE_PROFILES=cloudflare in deploy/.env.
  # The free route uses Tailscale Funnel on the host instead - see README.
  tunnel:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
