# Always-on deployment: the s1drops app, published by Tailscale Funnel on the
# host (free) or by an opt-in Cloudflare named tunnel. Both dial OUT, so the
# server needs no inbound ports beyond SSH. See deploy/README.md.
#
#   cd deploy && cp .env.example .env   # then fill it in
#   docker compose up -d --build

name: s1drops

services:
  app:
    build:
      context: ..
      dockerfile: s1drops/Dockerfile
    image: s1drops:latest
    restart: unless-stopped
    environment:
      S1DROPS_ADMIN_PASSWORD: ${S1DROPS_ADMIN_PASSWORD:?set S1DROPS_ADMIN_PASSWORD in deploy/.env}
      S1DROPS_CACHE_DIR: /data/cache
      # Accounts and verdicts. Outside the cube cache, backed up by backup-db.sh.
      S1DROPS_DB_PATH: /data/db/app.db
      # Signed-in admins (comma-separated emails): these accounts are admins from
      # their first sign-in, so the first admin needs no one to approve them.
      S1DROPS_ADMIN_EMAILS: ${S1DROPS_ADMIN_EMAILS:-}
      # The public address; sign-in links and Google's callback are built from it.
      S1DROPS_PUBLIC_URL: ${S1DROPS_PUBLIC_URL:-}
      # Google sign-in (optional): both set turns it on. See README section 6.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Empty disables LCZ; set to /data/lcz/lcz_cog.tif once the file is on the host.
      S1DROPS_LCZ_PATH: ${S1DROPS_LCZ_PATH:-}
      S1DROPS_NATIVE10_MAX_KM2: ${S1DROPS_NATIVE10_MAX_KM2:-10}
      S1DROPS_MAX_CUBE_BYTES: ${S1DROPS_MAX_CUBE_BYTES:-2000000000}
      # Trust X-Forwarded-Proto from cloudflared (another container, so not
      # 127.0.0.1); without it Solara sees http and its session cookie breaks.
      # Safe because the port is only reachable from localhost and the tunnel.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      # Baked cubes + optical tiles. Must outlive the container.
      - ${S1DROPS_DATA_DIR:-/srv/s1drops}/cache:/data/cache
      # Accounts and verdicts database. Must outlive the container.
      - ${S1DROPS_DATA_DIR:-/srv/s1drops}/db:/data/db
      # LCZ raster, read-only. Harmless if the directory is empty.
      - ${S1DROPS_DATA_DIR:-/srv/s1drops}/lcz:/data/lcz:ro
    # Localhost only: reachable from the server itself (or an SSH tunnel) for
    # debugging, never from the internet. Public traffic comes via cloudflared.
    ports:
      - "127.0.0.1:8765:8765"
    # write_cube() materialises the whole cube in RAM (capped by
    # S1DROPS_MAX_CUBE_BYTES); leave headroom for the bake read path and sessions.
    mem_limit: ${S1DROPS_MEM_LIMIT:-6g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # The JSON API for Space4All's Demolition detection page
  # (space4all.web.app/tools/demolitions/), from the same image, on the same
  # cubes and database. Funnel publishes it under /api on the same hostname
  # (README, "The Space4All API").
  api:
    image: s1drops:latest
    pull_policy: never        # built by the app service above
    restart: unless-stopped
    command: ["uvicorn", "s1drops.api.main:app", "--host", "0.0.0.0", "--port", "8766", "--proxy-headers"]
    environment:
      S1DROPS_CACHE_DIR: /data/cache
      S1DROPS_DB_PATH: /data/db/app.db
      S1DROPS_ADMIN_EMAILS: ${S1DROPS_ADMIN_EMAILS:-}
      S1DROPS_LCZ_PATH: ${S1DROPS_LCZ_PATH:-}
      # Space4All's Firebase project: whose sign-ins the API accepts.
      S1DROPS_FIREBASE_PROJECT: ${S1DROPS_FIREBASE_PROJECT:-livability-mapping-prod}
      # Pages allowed to call it (CORS), comma-separated.
      S1DROPS_API_ORIGINS: ${S1DROPS_API_ORIGINS:-https://space4all.web.app}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ${S1DROPS_DATA_DIR:-/srv/s1drops}/cache:/data/cache
      - ${S1DROPS_DATA_DIR:-/srv/s1drops}/db:/data/db
      - ${S1DROPS_DATA_DIR:-/srv/s1drops}/lcz:/data/lcz:ro
    ports:
      - "127.0.0.1:8766:8766"
    # Its own limit, so page requests can't starve a bake in the app (or the reverse).
    mem_limit: ${S1DROPS_API_MEM_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Opt-in: only for the Cloudflare named-tunnel route (needs a domain on
  # Cloudflare). Enable with COMPOSE_PROFILES=cloudflare in deploy/.env.
  # The free route uses Tailscale Funnel on the host instead - see README.
  tunnel:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
